<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP2go — Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white min-h-[100dvh] flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-300">
    
    <!-- Animated Background Blobs -->
    <div class="absolute top-0 -left-4 w-72 h-72 bg-brand-500/20 rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute bottom-0 -right-4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-pulse-slow"></div>

    <div class="max-w-xl w-full px-6 text-center relative z-10">
        <!-- Brand -->
        <div class="flex items-center justify-center gap-3 mb-12 animate-float">
            <div class="bg-gradient-to-br from-brand-500 to-purple-600 p-3 rounded-2xl text-white shadow-2xl shadow-brand-500/40">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </div>
            <span class="text-4xl font-black bg-gradient-to-r from-brand-600 to-purple-600 dark:from-brand-400 dark:to-purple-400 text-gradient tracking-tighter">RTSP2go</span>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold mb-6 transition-all">Sesuatu yang Besar <br/>Sedang Disiapkan.</h1>
        <p class="text-lg text-slate-600 dark:text-slate-400 mb-10 leading-relaxed">
            Platform streaming RTSP ke Web terefisien akan segera hadir. Tinggalkan email Anda untuk menjadi yang pertama tahu saat kami meluncur (dan dapatkan penawaran eksklusif Early Bird).
        </p>

        <!-- Newsletter Form -->
        <form id="interestForm" class="relative group">
            <div class="flex flex-col sm:flex-row gap-3 p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl transition-all group-focus-within:ring-2 ring-brand-500/20">
                <input 
                    type="email" 
                    id="emailInput"
                    required
                    placeholder="Masukkan alamat email Anda" 
                    class="flex-1 px-4 py-3 bg-transparent outline-none text-slate-900 dark:text-white placeholder:text-slate-400"
                />
                <button 
                    type="submit"
                    class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-8 py-3 rounded-xl transition-all shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2 whitespace-nowrap"
                >
                    Kabari Saya
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>
            <div id="statusMessage" class="mt-4 text-sm font-medium transition-all opacity-0"></div>
        </form>

        <div class="mt-20 flex items-center justify-center gap-8 text-slate-400">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <span class="text-sm font-semibold">Zero Latency</span>
            </div>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <span class="text-sm font-semibold">Multi-Protocol</span>
            </div>
        </div>
    </div>

    <!-- Theme Toggle -->
    <button onclick="toggleTheme()" class="fixed bottom-8 right-8 p-3 rounded-full bg-white dark:bg-slate-900 shadow-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-brand-400 hover:scale-110 transition-all z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
    </button>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        document.getElementById('interestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const status = document.getElementById('statusMessage');
            
            status.textContent = "Mengirim...";
            status.className = "mt-4 text-sm font-medium transition-all text-slate-500 opacity-100";

            try {
                const response = await fetch('/api/interest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (response.ok) {
                    status.textContent = "Terima kasih! Kami akan segera menghubungi Anda.";
                    status.classList.replace('text-slate-500', 'text-green-500');
                    document.getElementById('emailInput').value = '';
                } else {
                    throw new Error();
                }
            } catch (err) {
                status.textContent = "Ops! Terjadi kesalahan. Coba lagi nanti.";
                status.classList.replace('text-slate-500', 'text-red-500');
            }
        });
    </script>
</body>
</html>
