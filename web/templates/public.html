<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Dashboard Command Center</title>
    <script src="https://cdn.tailwindcss.com?v=3.4.1"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81', 950: '#1e1b4b' } } } }
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; } /* Prevent main scroll to act like an app */
        .leaflet-container { font-family: 'Inter', sans-serif; background: #0f172a; }
        .custom-popup .leaflet-popup-content-wrapper {
            background-color: transparent !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            border-radius: 12px;
            padding: 0 !important;
            overflow: hidden;
            border: none !important;
        }
        .custom-popup .leaflet-popup-content {
            margin: 0 !important;
            padding: 0 !important;
            width: 220px !important;
            line-height: 0;
        }
        .custom-popup .leaflet-popup-tip-container { display: none; }
        .custom-popup .leaflet-popup-close-button {
            color: #fff !important;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,1);
            padding: 6px !important;
            font-size: 16px !important;
        }
        
        /* Tab Transitions */
        .tab-content { transition: opacity 0.3s ease-in-out, transform 0.3s ease; width: 100%; height: 100%; }
        .tab-hidden { opacity: 0; pointer-events: none; transform: translateY(10px); z-index: -1; position: absolute; top:0; left:0; width: 100%; height: 100%; }
        .tab-active { opacity: 1; pointer-events: auto; transform: translateY(0); z-index: 10; position: relative; width: 100%; height: 100%; overflow: auto; }

        /* Subtle Marker Display */
        .marker-pulse {
            display: none;
        }

        /* Fixed size for Command Center Logo to prevent jumping */
        .brand-logo { 
            width: 180px; 
            font-size: 1.25rem; 
            white-space: nowrap;
        }

        /* Side Panel Styles */
        #sidePanel.open { transform: translateX(0); }
        #sidePanelOverlay.open { opacity: 1; pointer-events: auto; }
        
        .layer-item.active-layer {
            border-color: #3b82f6 !important;
            background: rgba(59, 130, 246, 0.05);
        }
        .dark .layer-item.active-layer {
            background: rgba(59, 130, 246, 0.1);
        }
        
        /* Marker Custom Pin Fixes */
        .custom-pin { transition: all 0.3s; }
        .marker-selected {
            filter: drop-shadow(0 0 6px #6366f1);
            z-index: 1000 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white h-screen w-screen flex flex-col transition-colors duration-300 relative">

    <!-- Navbar Minimalis -->
    <header class="flex-shrink-0 h-16 w-full fixed top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 md:px-6 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-brand-600 p-1.5 rounded-lg text-white shadow-lg shadow-brand-500/20 flex items-center justify-center">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            </div>
            <h1 class="brand-logo font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-blue-500 dark:from-brand-400 dark:to-blue-400 tracking-tight hidden sm:block">Command Center</h1>
        </div>
        
        <!-- Tab Controls -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-slate-200 dark:border-slate-700">
            <button id="btnTabMap" onclick="switchTab('map')" class="w-[110px] py-1.5 text-center text-sm font-semibold rounded-md transition-all shadow-sm bg-white dark:bg-slate-600 text-brand-600 dark:text-white">Map View</button>
            <button id="btnTabGrid" onclick="switchTab('grid')" class="w-[110px] py-1.5 text-center text-sm font-semibold rounded-md transition-all text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">All Cameras</button>
        </div>

        <!-- User Identity Branding -->
        <div class="hidden md:flex items-center gap-3 ml-auto mr-4 pr-4 border-r border-slate-200 dark:border-slate-700">
            <div class="text-right">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none">Public Hub</p>
                <p class="text-sm font-bold text-slate-700 dark:text-slate-200">{{ .User.FullName }}</p>
            </div>
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-brand-600 flex items-center justify-center text-white text-xs font-bold shadow-sm">
                {{ if .User.FullName }}{{ slice .User.FullName 0 1 }}{{ else }}U{{ end }}
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="themeToggleBtn" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h1a1 1 0 100 2h-1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative w-full mt-16 h-[calc(100vh-4rem)] overflow-hidden bg-slate-100 dark:bg-slate-950">
        
        <!-- Tab 1: Map View (Frameless) -->
        <div id="tab-map" class="tab-content tab-active">
            <div id="globalCameraMap" class="w-full h-full z-0"></div>

            <!-- Top Left Toolbar - Google Maps Style -->
            <div id="mapToolbar" class="absolute top-4 left-4 z-[1000] flex flex-col items-start gap-2 w-[calc(100vw-32px)] md:max-w-md pointer-events-none transition-all duration-300">
                <div class="pointer-events-auto relative w-full translate-y-0 opacity-100 transition-all duration-500">
                    <div class="flex items-center bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800 p-1 w-full overflow-hidden">
                        <button 
                            onclick="toggleSidePanel()" 
                            class="text-slate-500 hover:text-brand-600 p-2.5 transition-colors rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 shrink-0"
                            title="Toggle Layers"
                        >
                            <i data-lucide="menu" class="w-5 h-5"></i>
                        </button>
                        
                        <div class="flex-1 relative flex items-center min-w-0 ml-1">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4 pointer-events-none"></i>
                            <input 
                                id="mapSearchInput"
                                type="text" 
                                placeholder="Search cameras..." 
                                class="w-full pl-10 pr-10 py-2.5 bg-transparent text-[15px] outline-none dark:text-white font-medium placeholder:text-slate-400" 
                                oninput="handleMapSearch(this.value)"
                            />
                            <button 
                                id="clearSearchBtn"
                                onclick="clearMapSearch()"
                                class="hidden absolute right-2 p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                            >
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                        
                        <div class="flex items-center border-l border-slate-200 dark:border-slate-800 ml-1 pl-1">
                            <button 
                                class="p-2.5 text-slate-500 hover:text-brand-600 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors flex items-center justify-center"
                                title="Filters"
                            >
                                <i data-lucide="filter" class="w-5 h-5"></i>
                            </button>
                            <a href="/login" class="p-2.5 text-slate-500 hover:text-brand-600 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors flex items-center justify-center border-l border-slate-200 dark:border-slate-800 ml-1 pl-1" title="Admin Login">
                                <i data-lucide="user-circle" class="w-6 h-6"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Side Panel for Layer Selection -->
            <div id="sidePanel" class="fixed inset-y-0 left-0 w-80 bg-white dark:bg-slate-900 shadow-2xl z-[2000] -translate-x-full transition-transform duration-500 ease-in-out border-r border-slate-200 dark:border-slate-800 flex flex-col pt-16 mt-0">
                <div class="flex-shrink-0 p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                    <h2 class="text-xl font-bold dark:text-white bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-blue-500">Map Options</h2>
                    <button onclick="toggleSidePanel()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-slate-400 transition-colors">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto p-6 space-y-8">
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-4">Map Style</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="changeMapLayer('Dark')" class="layer-item p-1 rounded-xl border-2 border-transparent transition-all group active-layer" id="layeritem-Dark">
                                <div class="aspect-video rounded-lg bg-slate-800 border border-white/10 overflow-hidden mb-2 shadow-md relative">
                                    <div class="absolute inset-0 bg-[url('https://cartocdn-g9.p7s.com/rastertiles/dark_all/12/2529/1614@2x.png')] bg-cover opacity-50"></div>
                                    <div class="absolute inset-0 flex items-center justify-center"><i data-lucide="moon" class="w-6 h-6 text-white opacity-0 group-[.active-layer]:opacity-100"></i></div>
                                </div>
                                <span class="text-xs font-bold text-slate-600 dark:text-slate-400 group-[.active-layer]:text-brand-500">Dark Mode</span>
                            </button>
                            <button onclick="changeMapLayer('Light')" class="layer-item p-1 rounded-xl border-2 border-transparent transition-all group" id="layeritem-Light">
                                <div class="aspect-video rounded-lg bg-slate-100 border border-slate-900/10 overflow-hidden mb-2 shadow-md relative">
                                    <div class="absolute inset-0 bg-[url('https://cartocdn-g9.p7s.com/rastertiles/light_all/12/2529/1614@2x.png')] bg-cover opacity-50"></div>
                                    <div class="absolute inset-0 flex items-center justify-center"><i data-lucide="sun" class="w-6 h-6 text-slate-600 opacity-0 group-[.active-layer]:opacity-100"></i></div>
                                </div>
                                <span class="text-xs font-bold text-slate-600 dark:text-slate-400 group-[.active-layer]:text-brand-500">Light Mode</span>
                            </button>
                            <button onclick="changeMapLayer('OpenMaps')" class="layer-item p-1 rounded-xl border-2 border-transparent transition-all group" id="layeritem-OpenMaps">
                                <div class="aspect-video rounded-lg bg-green-50 border border-green-900/10 overflow-hidden mb-2 shadow-md relative">
                                    <div class="absolute inset-0 bg-[url('https://tile.openstreetmap.org/12/2529/1614.png')] bg-cover opacity-50"></div>
                                    <div class="absolute inset-0 flex items-center justify-center"><i data-lucide="map" class="w-6 h-6 text-green-600 opacity-0 group-[.active-layer]:opacity-100"></i></div>
                                </div>
                                <span class="text-xs font-bold text-slate-600 dark:text-slate-400 group-[.active-layer]:text-brand-500">Street Map</span>
                            </button>
                            <button onclick="changeMapLayer('Satellite')" class="layer-item p-1 rounded-xl border-2 border-transparent transition-all group" id="layeritem-Satellite">
                                <div class="aspect-video rounded-lg bg-blue-900/20 border border-blue-900/10 overflow-hidden mb-2 shadow-md relative">
                                    <div class="absolute inset-0 bg-[url('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/12/1614/2529')] bg-cover opacity-50"></div>
                                    <div class="absolute inset-0 flex items-center justify-center"><i data-lucide="globe" class="w-6 h-6 text-blue-600 opacity-0 group-[.active-layer]:opacity-100"></i></div>
                                </div>
                                <span class="text-xs font-bold text-slate-600 dark:text-slate-400 group-[.active-layer]:text-brand-500">Satellite</span>
                            </button>
                        </div>
                    </div>

                    <!-- Camera List Section -->
                    <div class="border-t border-slate-100 dark:border-slate-800 pt-6">
                        <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-4 px-1">Registered Cameras</h3>
                        <div id="mapSidebarCameraList" class="space-y-2 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                            <!-- Populated by JS -->
                            <div class="text-center py-8 text-slate-400 italic text-xs">Loading cameras...</div>
                        </div>
                    </div>
                </div>
                </div>
            </div>
            
            <!-- Side Panel Overlay -->
            <div id="sidePanelOverlay" onclick="toggleSidePanel()" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[1999] opacity-0 pointer-events-none transition-opacity duration-500"></div>

            <!-- Old collapsible map layer menu removed as requested -->
        </div>

        <!-- Tab 2: All Cameras (Grid View with Pagination) -->
        <div id="tab-grid" class="tab-content tab-hidden">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-brand-500/10 rounded-full blur-[120px] animate-pulse pointer-events-none z-0"></div>
            
            <div class="container mx-auto px-4 py-8 max-w-7xl relative z-10 min-h-[calc(100vh-4rem)] flex flex-col">
                <h3 class="text-xl font-bold mb-6 text-slate-800 dark:text-white flex items-center gap-2">
                    <svg class="h-6 w-6 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    All Camera Feeds
                </h3>

                <div id="streamsListContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8 content-start">
                    <!-- Javascript will populate this grid based on pagination -->
                </div>

                <!-- Footer Pagination Controls -->
                <div id="paginationControls" class="flex justify-center items-center gap-4 py-4 pt-6 border-t border-slate-200 dark:border-slate-800 mt-auto">
                    <button onclick="changePage(-1)" id="btnPrev" class="px-4 py-2 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm transition-colors text-sm font-semibold">Previous</button>
                    <span id="pageIndicator" class="text-sm font-medium text-slate-500 dark:text-slate-400">Page 1 of 1</span>
                    <button onclick="changePage(1)" id="btnNext" class="px-4 py-2 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm transition-colors text-sm font-semibold">Next</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Public Frameless Player Modal -->
    <div id="publicPlayerModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/90 backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none">
        <!-- Close Button (Always floating above) -->
        <button onclick="closePublicPlayerModal()" class="absolute top-4 right-4 md:top-6 md:right-6 z-[70] bg-black/60 hover:bg-red-500 text-white p-3 rounded-full backdrop-blur-md transition-colors group">
            <svg class="w-6 h-6 transform group-hover:rotate-90 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>

        <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent z-[70] pointer-events-none">
            <h3 id="publicPlayerTitle" class="text-white text-lg font-bold drop-shadow-lg text-center">Stream Name</h3>
        </div>

        <!-- Frameless Player Content Edge to Edge on Mobile, 95% on Desktop -->
        <div id="publicPlayerContent" class="w-full h-full md:w-[95vw] md:h-[92vh] md:rounded-2xl relative overflow-hidden transform scale-95 transition-transform duration-300 bg-black">
            <div id="publicVideoContainer" class="w-full h-full relative">
                 <!-- Iframe injected here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const publicStreams = [
            {{ range .Streams }}
            { name: "{{ .Name }}", lat: {{ .Lat }}, lng: {{ .Lng }}, enabled: {{ .Enabled }} },
            {{ end }}
        ];

        // Theme
        document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
            const html = document.documentElement;
            if (html.classList.contains('dark')) { 
                html.classList.remove('dark'); 
                localStorage.setItem('theme', 'light'); 
                changeMapLayer('Light');
            } else { 
                html.classList.add('dark'); 
                localStorage.setItem('theme', 'dark'); 
                changeMapLayer('Dark');
            }
        });

        // Tab Switching Logic
        function switchTab(tabId) {
            const tabMap = document.getElementById('tab-map');
            const tabGrid = document.getElementById('tab-grid');
            const btnMap = document.getElementById('btnTabMap');
            const btnGrid = document.getElementById('btnTabGrid');

            const activeClassBtn = ['bg-white', 'dark:bg-slate-600', 'shadow-sm', 'text-brand-600', 'dark:text-white'];
            const inactiveClassBtn = ['text-slate-500', 'dark:text-slate-400', 'hover:text-slate-700', 'dark:hover:text-slate-200', 'bg-transparent', 'shadow-none'];

            if (tabId === 'map') {
                tabGrid.classList.replace('tab-active', 'tab-hidden');
                tabMap.classList.replace('tab-hidden', 'tab-active');
                
                btnMap.classList.remove(...inactiveClassBtn);
                btnMap.classList.add(...activeClassBtn);
                
                btnGrid.classList.remove(...activeClassBtn);
                btnGrid.classList.add(...inactiveClassBtn);

                // Re-trigger map size computation in case it resized while hidden
                if(window.globalMap) {
                    setTimeout(() => window.globalMap.invalidateSize(), 300);
                }
            } else {
                tabMap.classList.replace('tab-active', 'tab-hidden');
                tabGrid.classList.replace('tab-hidden', 'tab-active');

                btnGrid.classList.remove(...inactiveClassBtn);
                btnGrid.classList.add(...activeClassBtn);
                
                btnMap.classList.remove(...activeClassBtn);
                btnMap.classList.add(...inactiveClassBtn);
                
                if(currentPage === 1 && !gridRendered) {
                    renderGridPage(1);
                    gridRendered = true;
                }
            }
        }

        // Pagination Logic
        let currentPage = 1;
        const itemsPerPage = 12;
        let gridRendered = false;

        function renderGridPage(page) {
            const container = document.getElementById('streamsListContainer');
            if(!container) return;
            
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const streamsToShow = publicStreams.slice(startIndex, endIndex);
            const totalPages = Math.ceil(publicStreams.length / itemsPerPage) || 1;

            container.innerHTML = '';

            if (streamsToShow.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 flex flex-col items-center justify-center text-center bg-white/50 dark:bg-slate-900/50 rounded-3xl border border-dashed border-slate-300 dark:border-slate-700">
                        <svg class="h-16 w-16 text-slate-300 dark:text-slate-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        <h3 class="text-xl font-bold text-slate-600 dark:text-slate-400">No active streams</h3>
                    </div>`;
            } else {
                streamsToShow.forEach(stream => {
                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-slate-900 rounded-2xl overflow-hidden shadow-lg border border-slate-100 dark:border-slate-800 hover:-translate-y-1 hover:shadow-brand-500/10 hover:border-brand-400/50 transition-all duration-300 group cursor-pointer";
                    card.onclick = () => openPublicPlayerModal(stream.name);
                    card.innerHTML = `
                        <div class="p-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-800">
                            <h3 class="font-bold text-[15px] truncate text-slate-800 dark:text-white group-hover:text-brand-600 transition-colors" title="${stream.name}">${stream.name}</h3>
                            <button onclick="event.stopPropagation(); goToMapMarker('${stream.name.replace(/'/g, "\\'")}')" class="p-1.5 text-slate-400 hover:text-brand-600 hover:bg-brand-50 dark:hover:bg-brand-900/30 rounded-lg transition-colors shrink-0 z-10" title="View location on map">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            </button>
                        </div>
                        <div class="video-container relative w-full bg-black aspect-video group/video">
                            <div class="snapshot-overlay absolute inset-0 w-full h-full flex items-center justify-center bg-cover bg-center cursor-pointer group/overlay transition-transform duration-500 group-hover/video:scale-[1.02]"
                                style="background-image: url('/api/snapshot?name=${encodeURIComponent(stream.name)}');">
                                <div class="bg-black/40 absolute inset-0 group-hover/overlay:bg-black/20 transition-all z-0 text-white/10 flex items-center justify-center">
                                    <svg class="w-20 h-20 opacity-10" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                                </div>
                                <div class="relative z-10 bg-black/40 backdrop-blur-md rounded-full p-4 transform transition-all duration-300 group-hover/overlay:scale-110 shadow-2xl">
                                    <svg class="h-8 w-8 text-white ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                                </div>
                            </div>
                        </div>`;
                    container.appendChild(card);
                });
            }

            // Update Controls
            document.getElementById('pageIndicator').innerText = `Page ${page} of ${totalPages}`;
            document.getElementById('btnPrev').disabled = (page === 1);
            document.getElementById('btnNext').disabled = (page === totalPages || totalPages === 0);
        }

        function changePage(delta) {
            const totalPages = Math.ceil(publicStreams.length / itemsPerPage) || 1;
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderGridPage(currentPage);
            
            // Scroll to top of tab grid
            document.getElementById('tab-grid').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToMapMarker(name) {
            if(!window.allMarkers || !window.globalMap) return;
            
            const markerObj = window.allMarkers.find(m => m.name === name);
            if(markerObj) {
                switchTab('map');
                
                // Fly to marker
                window.globalMap.flyTo(markerObj.marker.getLatLng(), 16, {
                    duration: 1.5,
                    easeLinearity: 0.25
                });
                
                // Open popup after flying finishes
                setTimeout(() => {
                    markerObj.marker.openPopup();
                    
                    // Highlight marker
                    const iconElement = markerObj.marker.getElement();
                    if(iconElement) {
                        iconElement.classList.add('marker-selected');
                        setTimeout(() => iconElement.classList.remove('marker-selected'), 3000);
                    }
                }, 1600);
            } else {
                alert("Location data not available for this camera.");
            }
        }

        // Modal Player Logic
        const modal = document.getElementById('publicPlayerModal');
        const modalContent = document.getElementById('publicPlayerContent');
        const videoContainer = document.getElementById('publicVideoContainer');
        const titleEl = document.getElementById('publicPlayerTitle');

        function openPublicPlayerModal(name) {
            titleEl.textContent = name;
            // Use standard rtc mode for primary public viewing
            const iframeSrc = `${window.location.protocol}//${window.location.host}/rtc/stream.html?src=${encodeURIComponent(name)}&mode=mse,webrtc,hls,mp4,mjpeg`;

            // Loading UI inside frameless container
            videoContainer.innerHTML = `
                <div class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-10 text-white shadow-inner">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent mb-4 shadow-[0_0_15px_rgba(99,102,241,0.5)]"></div>
                    <span class="font-medium text-sm animate-pulse tracking-wide text-brand-200">Connecting to feed...</span>
                </div>`;

            const iframe = document.createElement('iframe');
            iframe.src = iframeSrc;
            iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:20;';
            iframe.allow = 'autoplay; fullscreen; picture-in-picture';
            
            iframe.onload = () => {
                const ls = videoContainer.querySelector('.bg-gray-950');
                if(ls) ls.style.opacity = '0';
                setTimeout(() => { if(ls) ls.remove(); }, 300);
            };

            videoContainer.appendChild(iframe);

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
        }

        function closePublicPlayerModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
            setTimeout(() => { videoContainer.innerHTML = ''; }, 300);
        }

        // Close on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('pointer-events-none')) { closePublicPlayerModal(); }
        });

        // New Toolbar & Side Panel Logic
        function toggleSidePanel() {
            const panel = document.getElementById('sidePanel');
            const overlay = document.getElementById('sidePanelOverlay');
            panel.classList.toggle('open');
            overlay.classList.toggle('open');
            // Refresh icons inside panel
            lucide.createIcons();
        }

        function handleMapSearch(query) {
            const clearBtn = document.getElementById('clearSearchBtn');
            if(query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            if(!window.allMarkers) return;
            
            const q = query.toLowerCase();
            window.allMarkers.forEach(item => {
                if (item.name.toLowerCase().includes(q)) {
                    item.marker.addTo(window.globalMap);
                } else {
                    item.marker.remove();
                }
            });
        }

        function clearMapSearch() {
            const input = document.getElementById('mapSearchInput');
            input.value = '';
            handleMapSearch('');
        }

        function changeMapLayer(layerName) {
            if(!window.globalMap || !window.mapLayers) return;
            
            // Remove all existing tile layers
            Object.values(window.mapLayers).forEach(layer => {
                if(window.globalMap.hasLayer(layer)) window.globalMap.removeLayer(layer);
            });
            
            // Add requested layer
            if(window.mapLayers[layerName]) {
                window.mapLayers[layerName].addTo(window.globalMap);
            }
            
            // Update UI buttons active state in Side Panel
            document.querySelectorAll('.layer-item').forEach(btn => {
                btn.classList.remove('active-layer');
            });
            const activeBtn = document.getElementById('layeritem-' + layerName);
            if(activeBtn) activeBtn.classList.add('active-layer');
            
            // Re-render icons for checkmarks
            lucide.createIcons();
        }

        // Initialize Map
        document.addEventListener('DOMContentLoaded', () => {
            renderGridPage(1);
            lucide.createIcons();

            const mapContainer = document.getElementById('globalCameraMap');
            if(mapContainer && publicStreams.length > 0) {
                let mapCenter = [-7.2504, 112.7688];
                const validStreams = publicStreams.filter(s => s.lat !== 0 || s.lng !== 0);
                if (validStreams.length > 0) mapCenter = [validStreams[0].lat, validStreams[0].lng];

                window.mapLayers = {
                    'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}@2x.png', { maxZoom: 25, maxNativeZoom: 19, attribution: '&copy; CARTO' }),
                    'Light': L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}@2x.png', { maxZoom: 25, maxNativeZoom: 19, attribution: '&copy; CARTO' }),
                    'OpenMaps': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 25, maxNativeZoom: 19, attribution: '&copy; OSM' }),
                    'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 25, maxNativeZoom: 19, attribution: 'Esri' })
                };

                const currentTheme = document.documentElement.classList.contains('dark') ? 'Dark' : 'Light';
                const startLayer = window.mapLayers[currentTheme];
                
                window.globalMap = L.map('globalCameraMap', { 
                    zoomControl: false, 
                    layers: [startLayer],
                    closePopupOnClick: false
                }).setView(mapCenter, 13);
                
                // Initialize marker storage
                window.allMarkers = [];

                const bounds = [];
                validStreams.forEach(stream => {
                    const isEnabled = stream.enabled !== false;
                    const markerColor = isEnabled ? '#6366f1' : '#94a3b8';
                    
                    const customIcon = L.divIcon({
                        className: 'custom-pin',
                        html: `<div class="relative group cursor-pointer transition-none">
                                <div class="w-5 h-5 bg-white dark:bg-slate-900 rounded-full border-2 shadow-lg z-10 relative flex items-center justify-center transition-none" style="border-color: ${markerColor}">
                                    <div class="w-1.5 h-1.5 rounded-full" style="background-color: ${markerColor}"></div>
                                    ${!isEnabled ? '<div class="absolute -top-1 -right-1 w-2 h-2 bg-slate-400 border-2 border-white dark:border-slate-800 rounded-full"></div>' : ''}
                                </div>
                               </div>`,
                        iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -10]
                    });

                    const marker = L.marker([stream.lat, stream.lng], { icon: customIcon }).addTo(window.globalMap);
                    
                    const popupContent = `
                        <div class="relative w-[220px] h-[124px] bg-gray-950 group cursor-pointer overflow-hidden rounded-xl" onclick="openPublicPlayerModal('${stream.name}')">
                            <img src="/api/snapshot?name=${encodeURIComponent(stream.name)}" class="w-full h-full object-cover opacity-90 group-hover:opacity-60" 
                                 onload="this.parentElement.parentElement.parentElement.__popup && this.parentElement.parentElement.parentElement.__popup.update()"
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSJncmF5Ij48cGF0aCBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIHN0cm9rZS13aWR0aD0iMiIgZD0iTTQgMTZsNC41ODYtNC41ODZhMiAyIDAgMDEyLjgyODAwTDE2IDE2bS0yLTJsMS41ODYtMS41ODZhMiAyIDAgMDEyLjgyODAwTDIwIDE0bS02LTZoLjAxTTYgMjBoMTJhMiAyIDAgMDAyLTJWNmEyIDIgMCAwMC0yLTJINmEyIDIgMCAwMC0yIDJ2MTJhMiAyIDAgMDAyIDJ6Ii8+PC9zdmc+'">
                            
                            <div class="absolute bottom-0 left-0 right-0 p-2 pt-6 bg-gradient-to-t from-black/90 to-transparent pointer-events-none">
                                <h4 class="font-bold text-[11px] truncate text-white drop-shadow-md" title="${stream.name}">${stream.name}</h4>
                            </div>
                            ${isEnabled ? `
                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div class="bg-black/40 backdrop-blur-sm w-11 h-11 rounded-full flex items-center justify-center shadow-2xl transform scale-90 opacity-0 group-hover:scale-100 group-hover:opacity-100 transition-all duration-300">
                                    <svg class="w-6 h-6 text-white ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                                </div>
                            </div>` : ''}
                        </div>`;
                    const popup = L.popup({ 
                        className: 'custom-popup',
                        maxWidth: 220,
                        minWidth: 220,
                        autoPan: true,
                        autoPanPadding: L.point(100, 100)
                    }).setContent(popupContent);
                    
                    marker.bindPopup(popup);
                    marker.__popup = popup; 

                    // Store for search
                    window.allMarkers.push({ marker, name: stream.name });

                    bounds.push([stream.lat, stream.lng]);
                });

                if (bounds.length > 0 && !window.hasFittedBounds) {
                    window.globalMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 22 });
                    window.hasFittedBounds = true;
                }
                
                // Render sidebar list
                renderMapSidebarCameraList(publicStreams);

                // Set initial theme layer in UI
                changeMapLayer(currentTheme);
            } else if (mapContainer) {
                mapContainer.innerHTML = '<div class="w-full h-full bg-slate-900 flex flex-col items-center justify-center text-slate-500"><i data-lucide="map-pin" class="w-12 h-12 mb-3 opacity-50"></i><p>No location data available</p></div>';
                lucide.createIcons();
            }
        });
        function renderMapSidebarCameraList(streams) {
            const listContainer = document.getElementById('mapSidebarCameraList');
            if (!listContainer) return;

            if (!streams || streams.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-8 text-slate-400 italic text-xs">No cameras available</div>';
                return;
            }

            listContainer.innerHTML = streams.map(s => `
                <div onclick="focusCameraOnMap('${s.name}')" class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 transition-all cursor-pointer group/item">
                    <div class="w-10 h-10 rounded-lg ${s.enabled === false ? 'bg-slate-200 dark:bg-slate-800 text-slate-400' : 'bg-brand-50 dark:bg-brand-900/40 text-brand-500'} flex items-center justify-center shrink-0 border border-slate-200/50 dark:border-slate-700/50 transition-colors group-hover/item:border-brand-500/50 relative">
                        <i data-lucide="video" class="h-5 w-5"></i>
                        ${s.online ? '<span class="absolute -top-1 -right-1 flex h-3 w-3 rounded-full border-2 border-white dark:border-slate-900"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-full w-full bg-green-500"></span></span>' : ''}
                    </div>
                    <div class="min-w-0 pr-2">
                        <div class="text-xs font-black text-slate-800 dark:text-white uppercase truncate mb-0.5 group-hover/item:text-brand-500 transition-colors">${s.name}</div>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">ID: ${s.name.replace(/[^a-zA-Z0-9]/g,'').substring(0,8) || s.name}</span>
                            ${s.enabled === false ? '<span class="text-[8px] font-black bg-yellow-100 text-yellow-600 dark:bg-yellow-900/40 dark:text-yellow-400 px-1 rounded uppercase tracking-tighter">Disabled</span>' : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function focusCameraOnMap(name) {
            const item = window.allMarkers.find(m => m.name === name);
            if (item && window.globalMap) {
                window.globalMap.setView(item.marker.getLatLng(), 18, { animate: false });
                item.marker.openPopup();
            }
        }
    </script>
</body>
</html>
