<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP Web Transcoder - Public View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#818cf8', /* Indigo 400 */
                            500: '#6366f1', /* Indigo 500 */
                            600: '#4f46e5', /* Indigo 600 */
                            700: '#4338ca', /* Indigo 700 */
                            900: '#312e81', /* Indigo 900 */
                            950: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <script>
        // Apply theme immediately to prevent flash of wrong theme
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .opt-card.selected {
            border: 2px solid #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }

        .dark .opt-card.selected {
            background-color: rgba(30, 58, 138, 0.2);
        }

        /* Stream Container Styles */
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .snapshot-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 10;
        }

        .status-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 20;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-online {
            background-color: #10b981;
            color: white;
        }

        .status-offline {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white min-h-screen transition-colors duration-300 relative overflow-x-hidden">
    <!-- Animated background blob -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-brand-500/10 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-500/10 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <header class="sticky top-4 z-40 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200/50 dark:border-slate-800/50 px-6 py-4 mb-10 flex flex-col md:flex-row justify-between items-center gap-4 transition-all hover:bg-white/90 dark:hover:bg-slate-900/90">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-blue-500 dark:from-brand-400 dark:to-blue-400 tracking-tight">Live Monitoring</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1 font-medium">Real-time public stream overview</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="themeToggleBtn"
                    class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-yellow-400 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                    <!-- Sun Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h1a1 1 0 100 2h-1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z"
                            clip-rule="evenodd" />
                    </svg>
                    <!-- Moon Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                    </svg>
                </button>
                <a href="/login"
                    class="h-10 bg-brand-600 hover:bg-brand-700 text-white px-5 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center gap-2 shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 hover:-translate-y-0.5 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                    Admin Login
                </a>
            </div>
        </header>

        <section id="streamsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            {{ range .Streams }}
            <div class="card bg-white dark:bg-slate-900 rounded-2xl overflow-hidden shadow-xl shadow-slate-200/40 dark:shadow-none border border-slate-100 dark:border-slate-800 hover:-translate-y-1 hover:shadow-2xl hover:shadow-brand-500/20 hover:border-brand-400/50 dark:hover:border-brand-500/50 transition-all duration-300 group"
                data-name="{{ .Name }}" data-url="{{ .URL }}" data-backend="{{ .Backend }}">
                <div
                    class="p-4 flex justify-between items-center bg-white dark:bg-slate-900 backdrop-blur-sm border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <h3 class="font-bold text-lg truncate text-slate-800 dark:text-white" title="{{ .Name }}">{{
                            .Name }}</h3>
                    </div>
                </div>

                <!-- Aspect Ratio 16/9 -->
                <div class="video-container relative w-full bg-black aspect-video group" id="video-{{ .Name }}">
                    <div class="snapshot-overlay flex items-center justify-center cursor-pointer group"
                        id="overlay-{{ .Name }}" onclick="(function(el){ var p=location.protocol,h=location.hostname,port=location.port?':'+location.port:''; startLiveStream('{{ .Name }}', p+'//'+h+port+'/rtc/stream.html?src={{ .Name }}&mode=mse', el); })(this)"
                        style="background-image: url('/api/snapshot?name={{ .Name }}');">
                        <div
                            class="bg-brand-600/90 backdrop-blur-sm rounded-full p-4 transform transition-all duration-300 group-hover:scale-110 group-hover:bg-brand-500 shadow-xl shadow-brand-500/50">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white ml-1" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div
                    class="p-4 bg-slate-50/50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center gap-2">
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-semibold tracking-wider uppercase">Mode</span>
                    <div class="flex gap-2">
                        <button onclick="reloadPlayer('{{ .Name }}', 'webrtc')"
                            class="px-3 py-1.5 text-xs font-bold rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-800/60 transition-colors border border-blue-200 dark:border-blue-800/50">
                            WebRTC
                        </button>
                        <button onclick="reloadPlayer('{{ .Name }}', 'mse')"
                            class="px-3 py-1.5 text-xs font-bold rounded-full bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 hover:bg-brand-200 dark:hover:bg-brand-800/60 transition-colors border border-brand-200 dark:border-brand-800/50">
                            MSE
                        </button>
                    </div>
                </div>
            </div>
            {{ else }}
            <div
                class="col-span-full text-center py-20 bg-gray-50 dark:bg-gray-800/50 rounded-xl border border-dashed border-gray-300 dark:border-gray-700">
                <div
                    class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-200 dark:bg-gray-700/50 text-gray-400 dark:text-gray-500 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </div>
                <h3 class="text-xl font-medium text-gray-900 dark:text-white mb-2">No active streams</h3>
                <p class="text-gray-500 dark:text-gray-400 mb-6">Contact the administrator to add cameras.</p>
            </div>
            {{ end }}
        </section>
    </div>

    <script src="/static/js/app.js?v=21"></script>
    <script>
        // No MediaMTX, so no m3u8 initialization needed
    </script>
</body>

</html>
