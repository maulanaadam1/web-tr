<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Dashboard Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81', 950: '#1e1b4b' }
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); } 
        else { document.documentElement.classList.add('dark'); }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .snapshot-overlay { background-size: cover; background-position: center; }
        
        /* Map Customization */
        .leaflet-container { font-family: 'Inter', sans-serif; background: #0f172a; }
        .custom-popup .leaflet-popup-content-wrapper {
            background-color: rgba(15, 23, 42, 0.95);
            color: #f8fafc;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px;
        }
        .custom-popup .leaflet-popup-tip { background-color: rgba(15, 23, 42, 0.95); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white min-h-screen transition-colors duration-300 relative overflow-x-hidden">
    <!-- Animated background blob -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-brand-500/10 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-500/10 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <header class="sticky top-4 z-40 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200/50 dark:border-slate-800/50 px-6 py-4 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 transition-all hover:bg-white/90 dark:hover:bg-slate-900/90 hover:shadow-lg">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-blue-500 dark:from-brand-400 dark:to-blue-400 tracking-tight">CCTV Command Center</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1 font-medium">Real-time public live feed map overview</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="themeToggleBtn" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-yellow-400 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h1a1 1 0 100 2h-1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd" />
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                    </svg>
                </button>
                <a href="/login" class="h-10 bg-brand-600 hover:bg-brand-700 text-white px-5 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center gap-2 shadow-lg shadow-brand-500/30 hover:-translate-y-0.5">
                    Admin Login
                </a>
            </div>
        </header>

        <!-- Command Center Map -->
        <section class="mb-12 rounded-3xl overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 group relative">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10 pointer-events-none flex items-end p-6">
                <div class="select-none">
                    <h2 class="text-white text-2xl font-bold mb-1 drop-shadow-md">Area Overview</h2>
                    <p class="text-slate-200 text-sm drop-shadow-md flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                        Click any camera pin to view live stream
                    </p>
                </div>
            </div>
            <!-- Mapping Div -->
            <div id="globalCameraMap" class="w-full h-[50vh] min-h-[400px] z-0"></div>
        </section>

        <!-- Camera List Section -->
        <h3 class="text-xl font-bold mb-6 text-slate-800 dark:text-white flex items-center gap-2">
            <svg class="h-6 w-6 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            All Camera Feeds
        </h3>
        <section id="streamsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            {{ range .Streams }}
            <div class="card bg-white dark:bg-slate-900 rounded-2xl overflow-hidden shadow-lg border border-slate-100 dark:border-slate-800 hover:-translate-y-1 hover:shadow-brand-500/10 hover:border-brand-400/50 transition-all duration-300 group cursor-pointer" onclick="openPublicPlayerModal('{{ .Name }}')">
                <div class="p-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <h3 class="font-bold text-[15px] truncate text-slate-800 dark:text-white group-hover:text-brand-600 transition-colors" title="{{ .Name }}">{{ .Name }}</h3>
                    </div>
                </div>

                <div class="video-container relative w-full bg-black aspect-video group/video">
                    <div class="snapshot-overlay absolute inset-0 w-full h-full flex items-center justify-center cursor-pointer group/overlay transition-transform duration-500 group-hover/video:scale-[1.02]"
                        style="background-image: url('/api/snapshot?name={{ .Name }}');">
                        <div class="bg-black/40 absolute inset-0 group-hover/overlay:bg-black/20 transition-all z-0"></div>
                        <div class="relative z-10 bg-brand-600/90 backdrop-blur-sm rounded-full p-4 transform transition-all duration-300 group-hover/overlay:scale-110 group-hover/overlay:bg-brand-500 shadow-xl shadow-brand-500/50">
                            <svg class="h-8 w-8 text-white ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                        </div>
                    </div>
                </div>
            </div>
            {{ else }}
            <div class="col-span-full py-16 flex flex-col items-center justify-center text-center bg-white/50 dark:bg-slate-900/50 rounded-3xl border border-dashed border-slate-300 dark:border-slate-700">
                <svg class="h-16 w-16 text-slate-300 dark:text-slate-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                <h3 class="text-xl font-bold text-slate-600 dark:text-slate-400">No active streams</h3>
                <p class="text-slate-500 mt-2">Cameras will appear here once configured by the admin.</p>
            </div>
            {{ end }}
        </section>
    </div>

    <!-- Public Fullscreen Player Modal -->
    <div id="publicPlayerModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none">
        <div id="publicPlayerContent" class="bg-gray-900 rounded-3xl w-11/12 md:w-3/4 max-w-5xl aspect-video relative overflow-hidden shadow-2xl border border-gray-700 transform scale-95 transition-transform duration-300">
            <!-- Close Btn -->
            <button onclick="closePublicPlayerModal()" class="absolute top-4 right-4 z-50 bg-black/60 hover:bg-red-500 text-white p-2 rounded-full backdrop-blur-md transition-colors group border border-white/10 hover:border-red-400">
                <svg class="w-6 h-6 transform group-hover:rotate-90 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <!-- Title banner -->
            <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent z-40 pointer-events-none">
                <h3 id="publicPlayerTitle" class="text-white text-lg font-bold drop-shadow-lg">Stream Name</h3>
            </div>
            <div id="publicVideoContainer" class="w-full h-full bg-black relative">
                 <!-- Iframe injected here -->
            </div>
        </div>
    </div>

    <!-- Removed old app.js to strip dependencies on admin functionality not needed for public -->
    <script>
        // Data Extraction
        const publicStreams = [
            {{ range .Streams }}
            {
                name: "{{ .Name }}",
                lat: {{ .Lat }},
                lng: {{ .Lng }}
            },
            {{ end }}
        ];

        // Ensure theme toggle works from header
        document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Modal Player Logic
        const modal = document.getElementById('publicPlayerModal');
        const modalContent = document.getElementById('publicPlayerContent');
        const videoContainer = document.getElementById('publicVideoContainer');
        const titleEl = document.getElementById('publicPlayerTitle');

        function openPublicPlayerModal(name) {
            titleEl.textContent = name;
            const p = window.location.protocol;
            const h = window.location.hostname;
            const port = window.location.port ? ':'+window.location.port : '';
            // Default WebRTC
            const iframeSrc = `${p}//${h}${port}/rtc/stream.html?src=${encodeURIComponent(name)}&mode=webrtc`;

            videoContainer.innerHTML = '';
            
            // Loading State
            const loadingHtml = `
                <div class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-10">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent mb-4"></div>
                    <span class="text-white font-medium text-sm animate-pulse">Connecting to feed...</span>
                </div>`;
            videoContainer.innerHTML = loadingHtml;

            const iframe = document.createElement('iframe');
            iframe.src = iframeSrc;
            iframe.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;z-index:20;';
            iframe.allow = 'autoplay; fullscreen; picture-in-picture';
            
            iframe.onload = () => {
                const ls = videoContainer.querySelector('.bg-gray-900');
                if(ls) ls.style.opacity = '0';
                setTimeout(() => { if(ls) ls.remove(); }, 300);
            };

            videoContainer.appendChild(iframe);

            // Show Modal
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            document.body.style.overflow = 'hidden';
        }

        function closePublicPlayerModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                videoContainer.innerHTML = ''; // Destroy iframe securely
                document.body.style.overflow = 'auto'; // restore scroll
            }, 300);
        }

        // Close on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('pointer-events-none')) {
                closePublicPlayerModal();
            }
        });

        // Initialize Map
        document.addEventListener('DOMContentLoaded', () => {
            const mapContainer = document.getElementById('globalCameraMap');
            if(mapContainer && publicStreams.length > 0) {
                // Initialize default map config
                let mapCenter = [-7.2504, 112.7688]; // Surabaya Backup
                const validStreams = publicStreams.filter(s => s.lat !== 0 || s.lng !== 0);
                if (validStreams.length > 0) {
                    mapCenter = [validStreams[0].lat, validStreams[0].lng]; // Focus on first valid
                }

                const map = L.map('globalCameraMap', {
                    zoomControl: false // custom position
                }).setView(mapCenter, 13);
                
                L.control.zoom({ position: 'bottomright' }).addTo(map);

                // Use CartoDB Dark Matter
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}@2x.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/">OSM</a>, &copy; <a href="https://carto.com/">CARTO</a>',
                    maxZoom: 19
                }).addTo(map);

                const bounds = [];

                validStreams.forEach(stream => {
                    const customIcon = L.divIcon({
                        className: 'custom-pin',
                        html: `<div class="relative group cursor-pointer">
                                <div class="w-6 h-6 bg-brand-500 hover:bg-brand-400 rounded-full border-2 border-white shadow-lg z-10 relative flex items-center justify-center transition-colors">
                                    <div class="w-2 h-2 bg-white rounded-full"></div>
                                </div>
                                <div class="absolute inset-0 bg-brand-500 rounded-full animate-ping opacity-75"></div>
                               </div>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12],
                        popupAnchor: [0, -12]
                    });

                    const marker = L.marker([stream.lat, stream.lng], { icon: customIcon }).addTo(map);
                    
                    // The Bubble Content - clicking play button invokes openPublicPlayerModal
                    const popupContent = `
                        <div class="p-1 w-48 font-sans">
                            <h4 class="font-bold text-sm mb-2 truncate" title="${stream.name}">${stream.name}</h4>
                            <div class="relative aspect-video rounded overflow-hidden bg-black mb-1 group cursor-pointer" onclick="openPublicPlayerModal('${stream.name}')">
                                <img src="/api/snapshot?name=${encodeURIComponent(stream.name)}" class="w-full h-full object-cover opacity-80 group-hover:opacity-60 transition-opacity" onerror="this.style.display='none'">
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <button class="bg-brand-500 w-8 h-8 rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 group-hover:bg-brand-400 transition-all">
                                        <svg class="w-4 h-4 text-white ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent, { className: 'custom-popup' });
                    
                    bounds.push([stream.lat, stream.lng]);
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                }
            } else if (mapContainer) {
                // No cameras or no valid coords
                mapContainer.innerHTML = '<div class="w-full h-full flex flex-col items-center justify-center text-slate-500"><svg class="w-12 h-12 mb-3 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg><p>No location data available</p></div>';
            }
        });
    </script>
</body>
</html>
