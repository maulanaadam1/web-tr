server {
    listen 80;
    server_name stream.campod.my.id;

    # Allow stream.html for public players, but block admin API/UI
    location /rtc/stream.html {
        proxy_pass http://web-tr:8080;
        include proxy_params; # Assuming standard proxy headers
    }

    location ~* ^/(api/go2rtc|rtc/api|rtc/admin) {
        return 403;
    }

    # Proxy all traffic to the web-tr backend
    location / {
        proxy_pass http://web-tr:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for WebRTC streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
