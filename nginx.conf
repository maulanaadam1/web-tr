server {
    listen 80;
    server_name stream.campod.my.id;

    # Protect /rtc (Go2RTC Native Admin UI) from public access
    # Only superadmins with direct internal VPN access should see this, public internet drops here.
    location ~* ^/(rtc|api/go2rtc) {
        return 403;
    }

    # Proxy all traffic to the web-tr backend
    location / {
        proxy_pass http://web-tr:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for WebRTC streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
